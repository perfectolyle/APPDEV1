<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perfecto's DOM Playground</title>
</head>
<body>
  <h1>Perfecto's DOM Playground</h1>
  <button id="changeColorBtn">Change Background</button>
  <p id="message">This paragraph will update in 2 seconds.</p>

  <script>
    const button = document.getElementById("changeColorBtn");
    button.addEventListener("click", () => {
      const color = prompt("What color should the background be? (try: lavender)");
      document.body.style.backgroundColor = color;
    });

    const message = document.getElementById("message");
    setTimeout(() => {
      message.textContent = "Good morning, Perfecto! This paragraph updated itself after 2 seconds.";
    }, 2000);
  </script>
</body>
</html>
